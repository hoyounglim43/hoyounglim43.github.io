<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Mathematics</title>
    <link rel="icon" href="icon.png">

    <!-- Bootstap CDN -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta.3/css/bootstrap.min.css" integrity="sha384-Zug+QiDoJOrZ5t4lssLdxGhVrurbmBWopoEl+M6BdEfwnCJZtKxi1KgxUyJq13dy" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta.3/js/bootstrap.min.js" integrity="sha384-a5N7Y/aK3qNeh15eJKGWxsqtnX/wWdSZSKp+81YjTmS15nvnvxKHuzaWwXHDli+4" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">
  </head>

  <body>

    <h1 class="pageTitle">Mathematics</h1>

    <div class="container">
      <div class="row">

        <div class="card col-lg-6 card_box">
          <div class="card-body cardBody">
            <p id="counter1">0</p>
            <p id="question1"></p>
            <hr>
            <input id="userInput1" type="text" name="userInput">
            <button id="submitButton1" type="button" name="submitButton">Submit</button>
            <hr>
            <p id="result1"><p>
          </div>
        </div>

        <div class="card col-lg-6 card_box">
          <div class="card-body cardBody">
            <p id="question2"></p>
            <hr>
            <input id="userInput2" type="text" name="userInput">
            <button id="submitButton2" type="button" name="submitButton">Submit</button>
            <hr>
            <p id="result2"><p>
          </div>
        </div>

      </div>
    </div>

    <div>
      <hr>
      <p class="footer">2018. Multiplication.</p>
    </div>

    <script type="text/javascript">
      //Q1

      var counter = 0;

      var checkAnswer = function(){
        var userInput1 = document.getElementById("userInput1").value;


        if (answer1 == Number(userInput1)) {
          document.getElementById("result1").innerHTML = "Correct!";
          document.getElementById("result1").style.color="#1cc154";
          counter += 1;
        }
        else {
          document.getElementById("result1").innerHTML = "Wrong Answer, correct answer = " + answer1;
          document.getElementById("result1").style.color="#f00039";
          counter = 0;
        }

      document.getElementById("counter1").innerHTML = counter;
      document.getElementById("userInput1").value = "";

      }

      var answer1;

      var createQuestion = function() {
        var number11 = Math.floor(Math.random() * 9 + 1);
        var number12 = Math.floor(Math.random() * 9 + 1);
        var question1 = number11 + " × " + number12 + " = ";

        document.getElementById('question1').innerHTML = question1;

        answer1 = number11 * number12;
      }

      createQuestion();

      var timeOutFunction = function() {
        setTimeout(function() {
          document.getElementById("result1").innerHTML = "";
          createQuestion();
          // document.getElementById("userInput1").disabled = true;
          // document.getElementById("submitButton1").disabled = true;
        },1500);
      }

      document.getElementById("submitButton1").addEventListener("click", function() {
        checkAnswer();
        // timeOutFunction();
        timeOutFunction();

      })

      document.getElementById("userInput1").addEventListener("keypress", function() {

        var key = event.keyCode;
        if (key == 13) {
          checkAnswer();
          timeOutFunction();
        }


      })


    </script>


  </body>
</html>
