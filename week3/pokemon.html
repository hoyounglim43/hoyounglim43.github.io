<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Pokemon</title>
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>

  <body>
    <!-- Comment -->
    <h1>Pokemon</h1>
    <div id="charmander" class="charmander">
      <h2>Charmander</h2>
      <img class="image" src="img/charmander.jpeg" alt="Pokemon Charmander">
      <ul>
        <li><b>Category:</b> Lizard</li>
        <li><b>Type:</b> Fire</li>
        <li><b>Ability:</b> Blaze</li>
      </ul>
    </div>

    <div id="ivysaur" class="ivysaur">
      <h2>Ivysaur</h2>
      <img class="image" src="img/ivysaur.jpeg" alt="Pokemon Ivysaur">
      <ul>
        <li><b>Category:</b> Seed</li>
        <li><b>Type:</b> Grass, Poison</li>
        <li><b>Ability:</b> Overgrow</li>
      </ul>
    </div>


    <div id="mewtwo" class="mewtwo">
      <h2>Mewtwo</h2>
      <img class="image" src="img/mewtwo.jpeg" alt="Pokemon Mewtwo">
      <ul>
        <li><b>Category:</b> Genetic</li>
        <li><b>Type:</b> Psychic</li>
        <li><b>Ability:</b> Pressure</li>
      </ul>
    </div>

  </body>
</html>
